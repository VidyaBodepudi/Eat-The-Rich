[package]
name = "eat-the-rich-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
arrow = "58.1.0"
axum = { version = "0.8.8", features = ["ws"] }
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
crossbeam = "0.8.4"
dotenvy = "0.15.7"
duckdb = { version = "1.10501.0", features = ["bundled", "appender-arrow", "vtab-arrow"] }
reqwest = { version = "0.13.2", features = ["json"] }
ringbuf = "0.4.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokenizers = "0.22.2"
tokio = { version = "1.51.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
